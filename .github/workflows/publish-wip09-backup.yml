name: Publish verified WIP09 backup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-wip09-backup.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  backup:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Dynamon91/Zera-PS1-project
      BACKUP_SOURCE: 57384ee752f352680d1302563469b5f1496901fc
      BACKUP_TAG: wip09-all-relics-20261029
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 57384ee752f352680d1302563469b5f1496901fc
      - name: Retrieve pinned tested native build
        shell: bash
        run: |
          gh api repos/Dynamon91/Zera-PS1-project/actions/artifacts/12904922123/zip > "$RUNNER_TEMP/native.zip"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'native.zip'
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '3ca64ab49ac01ada25e7451c5d3c426eb840342e7b1acd8edd38866ba347c18c'
          PY
      - name: Reconstruct and verify complete checkpoint
        run: |
          python3 tools/package_wip.py --source-commit "$BACKUP_SOURCE" --native-artifact "$RUNNER_TEMP/native.zip" --output dist/Zera_PS1_WIP09_Source_Checkpoint.zip
          python3 tools/verify_checkpoint.py dist/Zera_PS1_WIP09_Source_Checkpoint.zip
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          archive = Path('dist/Zera_PS1_WIP09_Source_Checkpoint.zip')
          with zipfile.ZipFile(archive) as z:
              manifest = z.read('zera_ps1/CHECKPOINT.json')
              assert hashlib.sha256(manifest).hexdigest() == '9d2f28771789fd82f075b502d963ea1b9ff975da99356b1b84eb431468cc5634'
              status = json.loads(manifest)
              assert len(status['files']) == 1168
          checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive.with_suffix('.zip.sha256').write_text(checksum + '  ' + archive.name + '\n')
          Path('dist/release-notes.md').write_text('# Zera PS1\n\nObiettivo: port completo da Unity a PS1. Un progetto ambizioso, un passo alla volta.\n\n**Progresso stimato: 29% · WIP09**\n\n**3/3 reliquie raccolte · valore 20/20.**\n\n| Prima | Dopo |\n| --- | --- |\n| ![Prima](https://raw.githubusercontent.com/Dynamon91/Zera-PS1-project/57384ee752f352680d1302563469b5f1496901fc/docs/screenshots/relics/frame_0850.png) | ![Dopo](https://raw.githubusercontent.com/Dynamon91/Zera-PS1-project/57384ee752f352680d1302563469b5f1496901fc/docs/screenshots/relics/frame_4700.png) |\n')
          PY
      # Tag the current approved workflow commit; ZIP source remains pinned above.
      - name: Publish downloadable backup release
        run: |
          gh release create "$BACKUP_TAG" dist/Zera_PS1_WIP09_Source_Checkpoint.zip dist/Zera_PS1_WIP09_Source_Checkpoint.zip.sha256 --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Zera PS1 WIP09 - Tre reliquie completate, 29 ottobre 2026" --notes-file dist/release-notes.md --prerelease --latest=false
