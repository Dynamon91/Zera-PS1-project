name: Publish verified WIP09 backup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-wip09-backup.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  backup:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Dynamon91/Zera-PS1-project
      BACKUP_SOURCE: 8bd404cae8293ad5bd593428654f658fa1468e98
      BACKUP_TAG: wip09-relic-models-20261029
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8bd404cae8293ad5bd593428654f658fa1468e98
      - name: Retrieve pinned tested native build
        shell: bash
        run: |
          gh api repos/Dynamon91/Zera-PS1-project/actions/artifacts/12908675111/zip > "$RUNNER_TEMP/native.zip"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'native.zip'
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '3ed788af17b67fca9826c0720a8ad6b350decfa40670ee23acdbb999d1f40a7e'
          PY
      - name: Reconstruct and verify complete checkpoint
        run: |
          python3 tools/package_wip.py --source-commit "$BACKUP_SOURCE" --native-artifact "$RUNNER_TEMP/native.zip" --output dist/Zera_PS1_WIP09_Source_Checkpoint.zip
          python3 tools/verify_checkpoint.py dist/Zera_PS1_WIP09_Source_Checkpoint.zip
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          archive = Path('dist/Zera_PS1_WIP09_Source_Checkpoint.zip')
          with zipfile.ZipFile(archive) as z:
              manifest = z.read('zera_ps1/CHECKPOINT.json')
              assert hashlib.sha256(manifest).hexdigest() == '95bc331357b82909ea39db6f2b3820d59387b44135d6ef158b745dd2505c9d89'
              status = json.loads(manifest)
              assert len(status['files']) == 1178
          checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive.with_suffix('.zip.sha256').write_text(checksum + '  ' + archive.name + '\n')
          Path('dist/release-notes.md').write_text('# Zera PS1\n\n**Progresso stimato: 29% · WIP09**\n\nRipristinati il corpo originale delle reliquie e i colori di base ciano/verde. Shader ancora in lavorazione.\n\n| Prima | Dopo |\n| --- | --- |\n| ![Prima](https://raw.githubusercontent.com/Dynamon91/Zera-PS1-project/8bd404cae8293ad5bd593428654f658fa1468e98/docs/screenshots/relic_model/before.png) | ![Dopo](https://raw.githubusercontent.com/Dynamon91/Zera-PS1-project/8bd404cae8293ad5bd593428654f658fa1468e98/docs/screenshots/relic_model/after.png) |\n')
          PY
      # Tag the current approved workflow commit; ZIP source remains pinned above.
      - name: Publish downloadable backup release
        run: |
          gh release create "$BACKUP_TAG" dist/Zera_PS1_WIP09_Source_Checkpoint.zip dist/Zera_PS1_WIP09_Source_Checkpoint.zip.sha256 --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Zera PS1 WIP09 - Reliquie originali, 29 ottobre 2026" --notes-file dist/release-notes.md --prerelease --latest=false
