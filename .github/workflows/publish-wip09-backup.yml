name: Publish verified WIP09 backup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-wip09-backup.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  backup:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Dynamon91/Zera-PS1-project
      BACKUP_SOURCE: b38d655fe13a160204a8213e40529c4f10371625
      BACKUP_TAG: wip09-mascot-b38d655
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: b38d655fe13a160204a8213e40529c4f10371625
      - name: Retrieve pinned tested native build
        shell: bash
        run: |
          gh api repos/Dynamon91/Zera-PS1-project/actions/artifacts/12843741479/zip > "$RUNNER_TEMP/native.zip"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'native.zip'
          assert hashlib.sha256(path.read_bytes()).hexdigest() == 'bc2f81f58fd6e283b3359d977d2ae80318066e6b314a40afc74231a72bd578ed'
          PY
      - name: Reconstruct and verify complete checkpoint
        run: |
          python3 tools/package_wip.py --source-commit "$BACKUP_SOURCE" --native-artifact "$RUNNER_TEMP/native.zip" --output dist/Zera_PS1_WIP09_Source_Checkpoint.zip
          python3 tools/verify_checkpoint.py dist/Zera_PS1_WIP09_Source_Checkpoint.zip
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          archive = Path('dist/Zera_PS1_WIP09_Source_Checkpoint.zip')
          with zipfile.ZipFile(archive) as z:
              manifest = z.read('zera_ps1/CHECKPOINT.json')
              assert hashlib.sha256(manifest).hexdigest() == '386abfef42ceec23d1b75e17c960fbd0508e279084902691b1b52c86e31d3175'
              status = json.loads(manifest)
              assert len(status['files']) == 1089
          checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive.with_suffix('.zip.sha256').write_text(checksum + '  ' + archive.name + '\n')
          Path('dist/release-notes.md').write_text(
              'Backup completo WIP09 con mascotte Zera aggiornata, 28 ottobre 2026.\n\n'
              'Include la mascotte originale con texture di occhi e macchie, colori Gouraud e animazioni corrette, oltre a sorgenti, asset recuperati, documentazione, screenshot e il pacchetto native con entrambi i dischi PS1 verificati: level2 e anteprima level3.\n\n'
              'Dopo aver estratto lo ZIP principale, estrarre zera_ps1/native/Zera_PS1_WIP09_Native.zip. Aprire build/zera_wip09.cue per level2 oppure build/zera_level3_preview.cue per level3, lasciando i rispettivi BIN accanto.\n\n'
              'Snapshot sorgente: b38d655fe13a160204a8213e40529c4f10371625. Integrita verificata per tutti i 1089 file, con manifest identico al checkpoint consegnato. Il file SHA-256 permette di controllare il download.\n\n'
              'Completamento stimato: 29%. Build WIP, verificate in emulazione HLE; progressione originale e fisica completa restano in lavorazione.\n'
          )
          PY
      # Tag the current approved workflow commit; ZIP source remains pinned above.
      - name: Publish downloadable backup release
        run: |
          gh release create "$BACKUP_TAG" dist/Zera_PS1_WIP09_Source_Checkpoint.zip dist/Zera_PS1_WIP09_Source_Checkpoint.zip.sha256 --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Zera PS1 WIP09 - Mascotte aggiornata, 28 ottobre 2026" --notes-file dist/release-notes.md --prerelease --latest=false
