name: Host checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check gameplay modules with address and undefined-behavior sanitizers
        run: sh tools/run_host_checks.sh
      - name: Verify recovered original progression data
        run: |
          python3 tools/check_progression_recovery.py
          python3 tools/check_gameplay_recovery.py
          python3 tools/prepare_checkpoint_preview.py --check
          python3 tools/prepare_checkpoint_preview.py --area level3 --check
          python3 tools/prepare_corridor_relic.py --check
          python3 tools/check_wall_sources.py
          python3 tools/check_launchpad_recovery.py
          python3 tools/check_launch_assets.py
          python3 tools/audit_preview_collectibles.py --check
      - name: Check resumable package integrity and reproducibility
        run: python3 tools/test_package.py
      - name: Package current source and the labeled WIP08 playable checkpoint
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 tools/package_wip.py --source-commit "$SOURCE_COMMIT"
          python3 tools/verify_checkpoint.py dist/Zera_PS1_WIP09_Source_Checkpoint.zip
      - name: Upload WIP source checkpoint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Zera-PS1-WIP09-source-${{ github.sha }}
          path: dist/Zera_PS1_WIP09_Source_Checkpoint.zip
          if-no-files-found: error
          retention-days: 90
